appId: com.lifesystemsolution.pos
productName: Life System Solution POS
asarUnpack:
  - node_modules/prisma/**
  - node_modules/@prisma/**
  - node_modules/.prisma/**
files:
  - dist-renderer/**
  - dist-electron/**
  - prisma/**
  - package.json
  - node_modules/@prisma/client/**
  - node_modules/.prisma/**
  - node_modules/prisma/**
extraResources:
  - from: prisma
    to: prisma
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
